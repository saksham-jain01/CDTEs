[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skcd"
version = "0.1.0"
description = "Conditional Distributional Treatment Effects: Doubly Robust Estimation and Testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "optuna>=3.0",
    "optuna-integration[lightgbm]>=3.6",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skcd*"]
